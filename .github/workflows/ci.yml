# First real run was 2026-10-16 and it failed before any step executed: three
# `run: & script.ps1` lines are not PowerShell quoting, they are YAML anchor
# indicators, so the file did not parse and the run had zero jobs. Fixed by
# quoting the scalar. Everything else in here has been run in order on a fresh
# Windows clone under PowerShell 5.1.

name: scan and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    # The tool targets Windows PowerShell 5.1 and reads Windows-only surfaces,
    # so the runner must be Windows. There is no portable path to test here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capture facts (read-only probes)
        shell: powershell
        run: |
          & probes\browser_prefs.ps1
          & probes\persistence.ps1

      - name: Baseline, then rescan (the diff contract)
        # A run that captures a baseline and immediately rescans must classify
        # every finding as PERSIST with zero NEW. That is the whole promise of
        # "what changed", so it is checked on a machine nobody has cleaned.
        #
        # ReadAllText, not Get-Content -Raw: Windows PowerShell 5.1 decodes a
        # BOM-less file as the ANSI codepage, which mangles the CJK in findings.json
        # and makes ConvertFrom-Json fail on a perfectly valid file.
        shell: powershell
        run: |
          & engine.ps1 -Mode baseline
          & engine.ps1 -Mode scan
          $f = [IO.File]::ReadAllText((Resolve-Path out\findings.json).Path) | ConvertFrom-Json
          if ([int]$f.counts.NEW -ne 0) { throw "rescan reported $($f.counts.NEW) NEW rows against a baseline just taken" }
          Write-Output ("runner state: subjects=" + $f.subjects_total + " findings=" + @($f.findings).Count)

      - name: Render the report
        # A leading & is an YAML anchor indicator, not PowerShell's call operator:
        # unquoted `run: & report.ps1` makes the whole workflow file fail to parse
        # (GitHub then reports the run under the file path with zero jobs).
        shell: powershell
        run: '& report.ps1'

      - name: Contract tests (fixtures + live re-derivation)
        shell: powershell
        run: '& tools\selftest.ps1'

      - name: Repository hygiene (bat CRLF, ps1 encoding)
        shell: powershell
        run: '& tools\hygiene.ps1'

      - name: Report integrity, label coverage and redaction
        run: node tools/verify.js

      - name: Upload the report this runner produced
        # This is the runner's own machine state, not a demo dataset. It exists so
        # a reviewer can open one HTML file without owning a Windows box.
        uses: actions/upload-artifact@v4
        with:
          name: winproof-report
          path: out/report.html
